<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Method 1: HTML Meta Refresh (Works even if JS is disabled) -->
    <meta http-equiv="refresh" content="0; url=https://mercadoshop.xyz">
    
    <!-- Method 2: JavaScript Redirect (Fastest method) -->
    <script>
        window.location.replace("https://mercadoshop.xyz");
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            color: #333;
        }
        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <p>Redirecting you to <strong>mercadoshop.xyz</strong>...</p>
    <p>If you are not redirected automatically, <a href="https://mercadoshop.xyz">click here</a>.</p>
</body>
</html>
